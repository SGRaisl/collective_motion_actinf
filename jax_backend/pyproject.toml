[project]
name = "collective-motion-actinf-jax-backend"
version = "0.1.0"
description = "JAX backend for collective motion active inference simulations"
requires-python = ">=3.11"
dependencies = [
  "funcy>=2.0,<3",
  "matplotlib>=3.8,<4",
  "networkx>=3.3,<4",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
]

[dependency-groups]
cpu = [
  "jax>=0.9,<0.10",
  "jaxlib>=0.9,<0.10",
  "jax-md>=0.2.27,<0.3",
]
cuda12 = [
  "jax[cuda12]>=0.9,<0.10",
  "jax-md>=0.2.27,<0.3",
]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
